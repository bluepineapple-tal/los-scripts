version: '3.9'

services:
  postgres:
    image: postgres:15  # Use the desired PostgreSQL version
    container_name: los_postgres
    environment:
      POSTGRES_USER: los_user
      POSTGRES_PASSWORD: your_password
      POSTGRES_DB: los
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d # Optional for initialization scripts
    ports:
      - "5432:5432"
    restart: always

volumes:
  postgres_data:
